<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Exportar desenho</title>
  </head>
  <body>
    <!--
      Ferramenta do dev server (não entra no build): exporta um desenho do vault para SVG com o
      próprio Excalidraw e as fontes da marca (src/lib/diagramaSvg.ts), igual à aba Desenho do app.
      Usada por scripts/publicar-desenhos.mjs:
        window.exportarSvg('<id da nota>')    → string SVG do desenho inteiro
        window.exportarPartes('<id da nota>') → [UML, BPMN, C4], um SVG por diagrama
    -->
    <script type="module">
      window.EXCALIDRAW_ASSET_PATH = '/node_modules/@excalidraw/excalidraw/dist/';
      const { svgInteiro, partesSvg } = await import('/src/lib/diagramaSvg.ts');
      const ler = async (nota) => (await fetch('/api/desenho?nota=' + encodeURIComponent(nota))).json();
      window.exportarSvg = async (nota) => svgInteiro(await ler(nota));
      window.exportarPartes = async (nota) => partesSvg(await ler(nota));
      window.pronto = true;
    </script>
  </body>
</html>
